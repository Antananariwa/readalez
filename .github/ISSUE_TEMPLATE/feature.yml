name: Feature
description: New behaviour or a change
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible, and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable checks that make this done. They become the tests and the review checklist.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
      description: What this issue deliberately leaves out.